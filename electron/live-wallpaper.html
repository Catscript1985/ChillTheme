<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChillTheme Live Wallpaper</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}img{display:block;width:100%;height:100%;object-fit:cover;user-select:none;pointer-events:none}</style>
</head>
<body>
  <img id="wallpaper" alt="ChillTheme live wallpaper">
  <script>
    const filePath = decodeURIComponent(location.hash.slice(1)).replaceAll('\\', '/');
    const fileUrl = /^[A-Za-z]:\//.test(filePath) ? `file:///${filePath}` : `file://${filePath}`;
    document.getElementById('wallpaper').src = fileUrl;
  </script>
</body>
</html>
